services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - multitenant_node_modules:/app/node_modules
      # Keep Turbopack/.next cache on container storage (avoids MODULE_UNPARSABLE on Windows bind mounts).
      - multitenant_next_cache:/app/.next
    stdin_open: true
    tty: true

volumes:
  multitenant_node_modules:
  multitenant_next_cache:
