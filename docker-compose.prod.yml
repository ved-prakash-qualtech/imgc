services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # prod | uat — selects which root `.env.*` file is copied to `.env.production` during `next build`.
        APP_ENV: prod
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
